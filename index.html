<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2f2f7"><title>Poems — Notes</title><link rel="stylesheet" href="style.css"></head>
<body><div id="login" class="login"><div class="login-card"><div class="login-icon">✎</div><h1>Poems</h1><p>Your poetry notebook, wherever you are.</p><button id="loginBtn" class="primary">Sign in with GitHub</button><small>Poems are saved to your GitHub repository.</small></div></div>
<div id="app" class="app hidden"><aside class="sidebar" id="sidebar"><div class="top"><strong>Notes</strong><button id="newBtn">＋</button></div><div class="search">⌕ <input id="search" placeholder="Search"></div><nav><button class="folder active" data-folder="all">▤ <span>All Notes</span><b id="allCount">0</b></button><button class="folder" data-folder="favorites">★ <span>Favorites</span><b id="favCount">0</b></button><button class="folder" data-folder="drafts">✎ <span>Drafts</span><b id="draftCount">0</b></button></nav><div class="account"><span id="userName"></span><button id="logoutBtn">Sign out</button></div></aside>
<section class="list"><header><button class="mobile" id="openSide">☰</button><div><h2 id="folderTitle">All Notes</h2><small id="count">0 Notes</small></div><button id="newBtn2">＋</button></header><div id="notes"></div><div id="empty" class="empty"><div>✎</div><h3>No Notes</h3><p>Create your first poem.</p><button id="emptyNew" class="primary">New Note</button></div></section>
<section class="editor" id="editor"><header><button id="back">‹ Notes</button><div><button id="favorite">☆</button><button id="delete">⌫</button><button id="done">Done</button></div></header><main><input id="title" placeholder="Title" maxlength="120"><textarea id="body" placeholder="Begin writing..."></textarea><div id="meta"></div></main></section></div><div id="modal" class="modal hidden"><div><h3>Delete Note?</h3><p>This poem will be removed from your repository.</p><button id="cancel">Cancel</button><button id="confirm" class="danger">Delete</button></div></div><script src="app.js"></script></body></html>
