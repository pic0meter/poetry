<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Poems — Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="notes-app">
    <!-- Sidebar / Notes List -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Notes</h1>
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search">
        </div>
      </div>
      <div class="notes-list" id="notesList">
        <!-- Dynamic poem list items go here -->
      </div>
    </aside>

    <!-- Main View / Active Poem -->
    <main class="note-view">
      <div class="note-header">
        <span class="note-date" id="noteDate"></span>
      </div>
      <div class="note-content">
        <h2 id="noteTitle" contenteditable="false"></h2>
        <div id="noteBody" class="paper-texture"></div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
